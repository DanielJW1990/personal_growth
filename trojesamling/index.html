<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Trøjesamlingen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    /* Kølig, let blåtonet neutral — ikke rent grå */
    --ground-1: #dfe9f4;
    --ground-2: #f4f8fc;
    --ink: #101722;
    --muted: #5a6779;
    --glass-tint: 255 255 255;
    --glass-a: .55;
    --glass-b: .28;
    --edge: rgba(255, 255, 255, .70);
    --shadow: 0 30px 70px -30px rgba(12, 20, 34, .5);
    --field: rgba(255, 255, 255, .6);
    --field-line: rgba(16, 23, 34, .12);
    --danger: 358 62% 48%;
    /* Aktiv trøjetone — sættes af siden */
    --tone: 222 55% 32%;
    --maxw: 1240px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ground-1: #070b12;
      --ground-2: #10161f;
      --ink: #f2f6fb;
      --muted: #9aa6b8;
      --glass-tint: 190 210 240;
      --glass-a: .16;
      --glass-b: .07;
      --edge: rgba(255, 255, 255, .28);
      --shadow: 0 30px 70px -30px rgba(0, 0, 0, .85);
      --field: rgba(255, 255, 255, .08);
      --field-line: rgba(255, 255, 255, .16);
    }
  }
  :root[data-theme="dark"] {
    --ground-1: #070b12;
    --ground-2: #10161f;
    --ink: #f2f6fb;
    --muted: #9aa6b8;
    --glass-tint: 190 210 240;
    --glass-a: .16;
    --glass-b: .07;
    --edge: rgba(255, 255, 255, .28);
    --shadow: 0 30px 70px -30px rgba(0, 0, 0, .85);
    --field: rgba(255, 255, 255, .08);
    --field-line: rgba(255, 255, 255, .16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(178deg, var(--ground-1) 0%, var(--ground-2) 55%, var(--ground-1) 100%);
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: none; cursor: pointer; }
  :focus-visible { outline: 2px solid hsl(var(--tone)); outline-offset: 3px; border-radius: 8px; }

  .display { font-family: "Bricolage Grotesque", "Manrope", sans-serif; font-weight: 800; letter-spacing: -.02em; }

  /* ── Omgivende lys: farvede skyer der følger trøjen ── */
  .aura { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .aura i {
    position: absolute; display: block; border-radius: 50%;
    background: hsl(var(--tone) / .5); filter: blur(90px);
    transition: background 700ms ease;
  }
  .aura i:nth-child(1) { width: 46vw; height: 46vw; top: -14vw; left: -8vw; opacity: .5; }
  .aura i:nth-child(2) { width: 38vw; height: 38vw; bottom: -14vw; right: -6vw; opacity: .38; }

  .wrap { position: relative; z-index: 1; max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }

  /* ── Glasmateriale ─────────────────────────────────── */
  .glass {
    position: relative; border-radius: 26px;
    background: linear-gradient(158deg, rgb(var(--glass-tint) / var(--glass-a)), rgb(var(--glass-tint) / var(--glass-b)));
    backdrop-filter: blur(26px) saturate(175%);
    -webkit-backdrop-filter: blur(26px) saturate(175%);
    border: 1px solid var(--edge);
    box-shadow: var(--shadow), inset 0 1px 0 rgb(255 255 255 / .5);
    isolation: isolate;
  }
  .glass::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(130% 90% at 10% -15%, rgb(255 255 255 / .5), transparent 58%);
    mix-blend-mode: screen; opacity: .8; z-index: -1;
  }
  .toned {
    background:
      linear-gradient(158deg, hsl(var(--tone) / .84), hsl(var(--tone) / .6)),
      linear-gradient(158deg, rgb(255 255 255 / .2), rgb(255 255 255 / .04));
    color: #fff; border-color: hsl(var(--tone) / .5);
    transition: background 700ms ease, border-color 700ms ease;
  }

  /* ── Topbjælke ─────────────────────────────────────── */
  .bar-holder { position: sticky; top: 12px; z-index: 40; padding: 12px 0 0; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 18px; border-radius: 999px; }
  .brand { font-family: "Bricolage Grotesque", "Manrope", sans-serif; font-weight: 800; font-size: .95rem; display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .brand i { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: hsl(var(--tone)); color: #fff; font-size: .68rem; font-style: normal; transition: background 700ms ease; }
  nav.mainnav { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
  .navlink, .navdrop > summary {
    list-style: none; cursor: pointer; user-select: none; display: inline-block;
    padding: 8px 13px; border-radius: 999px; font-size: .82rem; font-weight: 600; color: var(--muted);
    white-space: nowrap; transition: color .2s, background .2s;
  }
  .navlink:hover, .navdrop > summary:hover { color: var(--ink); background: rgb(var(--glass-tint) / .4); }
  .navdrop { position: relative; }
  .navdrop > summary::-webkit-details-marker { display: none; }
  .navdrop > summary::after { content: " ⌄"; opacity: .6; }
  .navdrop-menu {
    position: absolute; top: calc(100% + 10px); left: 0; min-width: 220px; z-index: 50;
    padding: 8px; border-radius: 20px; max-height: 340px; overflow: auto;
  }
  .navdrop-menu button {
    display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left;
    padding: 9px 12px; font-size: .86rem; font-weight: 500; border-radius: 12px;
  }
  .navdrop-menu button:hover { background: hsl(var(--tone) / .9); color: #fff; }
  .navdrop-menu .count { color: var(--muted); font-size: .76rem; font-variant-numeric: tabular-nums; }
  .navdrop-menu button:hover .count { color: rgb(255 255 255 / .8); }
  .nav-right { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .icon-btn { width: 38px; height: 38px; border-radius: 999px; display: grid; place-items: center; background: rgb(var(--glass-tint) / .45); border: 1px solid var(--edge); font-size: .95rem; }
  .burger { display: none; }

  /* ── Fælles smådele ────────────────────────────────── */
  .pill { font-size: .7rem; font-weight: 600; padding: 5px 11px; border-radius: 999px; background: rgb(var(--glass-tint) / .5); border: 1px solid var(--edge); color: var(--ink); white-space: nowrap; }
  .eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: rgb(255 255 255 / .72); margin-bottom: 12px; }

  /* ── Overblik: forsidens rolige hoved ──────────────── */
  .overview-wrap { padding: 104px 0 0; }
  .overview { padding: 36px 34px 32px; border-radius: 30px; }
  .overview .eyebrow { color: var(--muted); margin-bottom: 10px; }
  .overview h1 { font-family: "Bricolage Grotesque", "Manrope", sans-serif; font-weight: 800; font-size: clamp(2.1rem, 4.6vw, 3.2rem); line-height: 1; letter-spacing: -.03em; }
  .overview .lead { color: var(--muted); font-size: .98rem; max-width: 54ch; margin-top: 12px; }
  .overview-stats { display: flex; gap: 34px; flex-wrap: wrap; margin-top: 28px; }
  .ov-stat .n { font-family: "Bricolage Grotesque", "Manrope", sans-serif; font-weight: 800; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .ov-stat .l { font-size: .66rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 999px;
    font-size: .84rem; font-weight: 600; padding: 11px 20px; white-space: nowrap;
    background: hsl(var(--tone) / .95); color: #fff; border: 1px solid hsl(var(--tone) / .6);
    box-shadow: 0 12px 26px -14px hsl(var(--tone)); transition: transform .2s, filter .2s;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .btn.on-tone { background: rgb(255 255 255 / .18); border-color: rgb(255 255 255 / .35); backdrop-filter: blur(8px); }
  .btn.ghost { background: rgb(var(--glass-tint) / .5); color: var(--ink); border-color: var(--edge); box-shadow: none; }
  .btn.danger { background: hsl(var(--danger) / .9); border-color: hsl(var(--danger) / .5); box-shadow: none; }
  .btn.sm { padding: 8px 14px; font-size: .78rem; }

  /* ── Værktøjslinje ─────────────────────────────────── */
  .toolbar { margin: 26px 0 0; padding: 12px; border-radius: 22px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type="search"], .toolbar select {
    border: 1px solid var(--field-line); border-radius: 14px; background: var(--field);
    padding: 10px 14px; font-size: .86rem; color: var(--ink);
  }
  .toolbar input[type="search"] { flex: 1 1 220px; min-width: 0; }
  .toolbar select { cursor: pointer; }
  .result-count { font-size: .78rem; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .linkbtn { font-size: .8rem; color: var(--muted); text-decoration: underline; padding: 6px; }
  .linkbtn:hover { color: var(--ink); }

  /* ── Gitter ────────────────────────────────────────── */
  .section { padding: 44px 0 0; }
  .section-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; padding: 0 4px; }
  .section-head h2 { font-family: "Bricolage Grotesque", "Manrope", sans-serif; font-weight: 800; font-size: 1.45rem; letter-spacing: -.02em; }
  .section-head .count { font-size: .8rem; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(216px, 1fr)); gap: 16px; }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 12px; padding: 14px;
    border-radius: 24px; color: #fff; text-align: left;
    background:
      linear-gradient(158deg, hsl(var(--tone) / .72), hsl(var(--tone) / .44)),
      linear-gradient(158deg, rgb(255 255 255 / .2), rgb(255 255 255 / .04));
    backdrop-filter: blur(20px) saturate(170%);
    -webkit-backdrop-filter: blur(20px) saturate(170%);
    border: 1px solid hsl(var(--tone) / .45);
    box-shadow: 0 22px 44px -26px hsl(var(--tone) / .95), inset 0 1px 0 rgb(255 255 255 / .38);
    transition: transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s;
  }
  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(120% 80% at 14% -10%, rgb(255 255 255 / .4), transparent 55%);
    mix-blend-mode: screen; opacity: .75;
  }
  .card:hover { transform: translateY(-5px); box-shadow: 0 34px 60px -28px hsl(var(--tone)), inset 0 1px 0 rgb(255 255 255 / .5); }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card-img { position: relative; aspect-ratio: 4/5; border-radius: 16px; overflow: hidden; background: rgb(0 0 0 / .16); display: grid; place-items: center; }
  .card-img img { width: 100%; height: 100%; object-fit: cover; transition: opacity .3s ease, transform .5s ease; }
  .card:hover .card-img img.primary { transform: scale(1.04); }
  .card-img img.alt { position: absolute; inset: 0; opacity: 0; }
  .card:hover .card-img img.alt { opacity: 1; }
  .card h3 { font-size: .94rem; font-weight: 700; letter-spacing: -.01em; }
  .card .meta { font-size: .78rem; color: rgb(255 255 255 / .74); font-variant-numeric: tabular-nums; }
  .tag { font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: rgb(255 255 255 / .2); border: 1px solid rgb(255 255 255 / .3); }
  .badge { font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: rgb(255 255 255 / .9); color: #12181f; }
  .placeholder-jersey { width: 46%; opacity: .35; }

  .empty { text-align: center; padding: 80px 20px; }
  .empty h2 { font-family: "Bricolage Grotesque", "Manrope", sans-serif; font-weight: 800; font-size: 1.6rem; margin-bottom: 8px; }
  .empty p { color: var(--muted); margin-bottom: 22px; }

  /* ── Statistik ─────────────────────────────────────── */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 14px; }
  .stat { padding: 22px; border-radius: 22px; }
  .stat .n { font-family: "Bricolage Grotesque", "Manrope", sans-serif; font-weight: 800; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: .7rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  .klub-bars { display: grid; gap: 10px; margin-top: 16px; padding: 22px; border-radius: 22px; }
  .klub-bar { display: grid; grid-template-columns: minmax(90px, 160px) 1fr 34px; gap: 12px; align-items: center; font-size: .84rem; }
  .klub-bar .bar { height: 8px; border-radius: 999px; background: rgb(var(--glass-tint) / .4); overflow: hidden; }
  .klub-bar .bar i { display: block; height: 100%; border-radius: 999px; background: hsl(var(--k) / .95); }
  .klub-bar .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ── Detaljeside ───────────────────────────────────── */
  .backlink { display: inline-flex; align-items: center; gap: 8px; margin: 22px 0 14px; font-size: .82rem; font-weight: 600; color: var(--muted); }
  .backlink:hover { color: var(--ink); }
  .detail { border-radius: 30px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 6fr); }
  .gallery { position: relative; padding: 26px; display: flex; flex-direction: column; gap: 14px; }
  .gallery::before { content: ""; position: absolute; inset: 0; background: radial-gradient(80% 60% at 50% 100%, rgb(0 0 0 / .26), transparent 70%); }
  .gallery-main { position: relative; border-radius: 18px; overflow: hidden; display: grid; place-items: center; min-height: 340px; background: rgb(0 0 0 / .12); }
  .gallery-main img { max-height: 520px; width: 100%; object-fit: contain; }
  .thumbs { position: relative; display: flex; gap: 10px; flex-wrap: wrap; }
  .thumbs button { width: 68px; height: 84px; border-radius: 12px; overflow: hidden; padding: 0; border: 1px solid rgb(255 255 255 / .3); background: rgb(0 0 0 / .15); opacity: .65; transition: opacity .2s, border-color .2s; }
  .thumbs button.active { opacity: 1; border-color: #fff; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  .detail-body { padding: 34px; display: flex; flex-direction: column; }
  .detail-body h1 { font-family: "Bricolage Grotesque", "Manrope", sans-serif; font-weight: 800; font-size: clamp(2rem, 4.4vw, 3.2rem); line-height: .98; letter-spacing: -.03em; text-wrap: balance; }
  .detail-sub { font-size: 1rem; color: rgb(255 255 255 / .78); margin: 6px 0 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .chip { font-size: .74rem; font-weight: 600; padding: 7px 13px; border-radius: 999px; background: rgb(255 255 255 / .16); border: 1px solid rgb(255 255 255 / .3); }
  .specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 2px; border-radius: 18px; overflow: hidden; background: rgb(255 255 255 / .16); margin-bottom: 22px; }
  .spec { background: hsl(var(--tone) / .55); padding: 14px 16px; transition: background 700ms ease; }
  .spec dt { font-size: .66rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgb(255 255 255 / .7); margin-bottom: 4px; }
  .spec dd { font-size: 1rem; font-weight: 600; }
  .notes h2 { font-size: .72rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: rgb(255 255 255 / .7); margin-bottom: 8px; }
  .notes p { font-size: .94rem; line-height: 1.65; color: rgb(255 255 255 / .85); white-space: pre-wrap; }
  .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }

  /* ── Login ─────────────────────────────────────────── */
  .login-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; position: relative; z-index: 1; }
  .login-card { width: 100%; max-width: 400px; padding: 40px 34px; border-radius: 30px; text-align: center; }
  .login-card .brand { justify-content: center; font-size: 1rem; margin-bottom: 20px; }
  .login-card h1 { font-family: "Bricolage Grotesque", "Manrope", sans-serif; font-weight: 800; font-size: 1.6rem; letter-spacing: -.02em; }
  .login-card p { color: var(--muted); font-size: .88rem; margin: 6px 0 22px; }
  .login-card input[type="password"] {
    width: 100%; border: 1px solid var(--field-line); border-radius: 16px; background: var(--field);
    padding: 14px; font-size: 1rem; text-align: center; letter-spacing: .12em; margin-bottom: 12px;
  }
  .login-remember { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: .82rem; color: var(--muted); margin-bottom: 16px; }
  .login-error { color: hsl(var(--danger)); font-size: .82rem; min-height: 1.3em; margin-bottom: 10px; }
  .login-card .btn { width: 100%; justify-content: center; }

  /* ── Admin ─────────────────────────────────────────── */
  .admin-head { padding: 84px 0 4px; }
  .admin-head h1 { font-family: "Bricolage Grotesque", "Manrope", sans-serif; font-weight: 800; font-size: 2rem; letter-spacing: -.03em; }
  .admin-head .eyebrow { color: var(--muted); margin-bottom: 8px; }
  .admin-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; padding: 20px 0 70px; align-items: start; }
  .panel { padding: 26px; border-radius: 26px; }
  .panel h2 { font-family: "Bricolage Grotesque", "Manrope", sans-serif; font-weight: 800; font-size: 1.1rem; letter-spacing: -.02em; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: .68rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .field input[type="text"], .field input[type="number"], .field select, .field textarea {
    width: 100%; border: 1px solid var(--field-line); border-radius: 14px; background: var(--field); padding: 11px 13px; font-size: .9rem;
  }
  .field textarea { min-height: 110px; resize: vertical; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .radio-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; padding-top: 8px; }
  .radio-row label { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: .88rem; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 0; }
  .color-row { display: flex; align-items: center; gap: 12px; }
  .color-row input[type="color"] { width: 52px; height: 40px; padding: 3px; border: 1px solid var(--field-line); border-radius: 12px; background: var(--field); cursor: pointer; }
  .color-row .hint { font-size: .76rem; color: var(--muted); }
  .dropzone { border: 1.5px dashed var(--field-line); border-radius: 18px; background: var(--field); padding: 22px; text-align: center; color: var(--muted); font-size: .85rem; cursor: pointer; transition: border-color .2s, color .2s; }
  .dropzone.drag { border-color: hsl(var(--tone)); color: hsl(var(--tone)); }
  .img-previews { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .img-previews .pv { position: relative; width: 74px; height: 92px; border-radius: 12px; overflow: hidden; border: 1px solid var(--field-line); }
  .img-previews .pv img { width: 100%; height: 100%; object-fit: cover; }
  .img-previews .pv .rm { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; background: rgb(10 16 26 / .75); color: #fff; font-size: .68rem; line-height: 1; }
  .img-previews .pv .tag2 { position: absolute; bottom: 0; left: 0; right: 0; background: hsl(var(--tone) / .9); color: #fff; font-size: .54rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; text-align: center; padding: 3px 0; }
  .form-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .admin-list { display: grid; gap: 10px; }
  .admin-row { display: grid; grid-template-columns: 50px 1fr auto; gap: 14px; align-items: center; padding: 10px 12px; border-radius: 18px; background: var(--field); border: 1px solid var(--field-line); }
  .admin-row .thumb { width: 50px; height: 62px; border-radius: 10px; overflow: hidden; background: hsl(var(--k, var(--tone)) / .3); }
  .admin-row .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .admin-row .t { font-weight: 700; font-size: .9rem; }
  .admin-row .m { font-size: .78rem; color: var(--muted); }
  .admin-row .acts { display: flex; gap: 6px; }
  .datatools { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--field-line); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .datatools .hint { flex-basis: 100%; font-size: .76rem; color: var(--muted); }

  footer { padding: 40px 0 46px; text-align: center; font-size: .76rem; color: var(--muted); }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);

<body>
<div class="aura"><i></i><i></i></div>
<div id="app"></div>
<div id="toast"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   Trøjesamlingen — privat katalog over fodboldtrøjer.
   Ren visning/katalogisering: ingen priser, kurv eller betaling.
   Glasmaterialet tones af hver trøjes klubfarve.
   ═══════════════════════════════════════════════════════════════ */

/* Adgangskoden gemmes kun som SHA-256-hash. Skift kode: kør
   `node -e "console.log(require('crypto').createHash('sha256').update('NY-KODE').digest('hex'))"`
   og indsæt resultatet her. */
const PASS_HASH = '499964967e93d809071dab6f0004795dabe07e3f170d3aa62faef2799af2a261';
const AUTH_KEY = 'ts_auth_v1';

const TYPE_LABELS = { hjemme: 'Hjemme', ude: 'Ude', tredje: 'Tredje', anden: 'Anden' };
const SIZES = ['XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL', 'Børnestr.', 'Andet'];

/* Klubfarver: tonen der farver glasset. Ukendte klubber får en
   stabil tone udledt af navnet, og hver trøje kan overstyre med sin egen. */
const CLUB_TONES = {
  'arsenal': [355, 72, 42],
  'brøndby if': [44, 92, 47],
  'danmark': [354, 70, 45],
  'ajax': [4, 76, 45],
  'ac milan': [352, 45, 24],
  'inter': [224, 68, 32],
  'ssc napoli': [205, 76, 46],
  'juventus': [220, 14, 22],
  'olympique marseille': [199, 72, 45],
  'sampdoria': [214, 62, 38],
  'italien': [214, 70, 40],
  'tyskland': [220, 12, 24],
  'japan': [222, 70, 38],
  'mexico': [152, 52, 30],
  'rangers fc': [222, 72, 36],
  'bradford city': [340, 52, 30],
  'fremad amager': [214, 72, 42],
  'fc porto': [214, 70, 40],
  'cagliari': [214, 58, 34],
  'as roma': [10, 58, 38],
  'brickfield rangers': [172, 55, 34],
  'ob': [24, 88, 48],
  'pigeons': [206, 22, 40],
};

const PLACEHOLDER_SVG = `
  <svg class="placeholder-jersey" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M35 10 L20 18 L8 40 L22 47 L26 40 L26 90 L74 90 L74 40 L78 47 L92 40 L80 18 L65 10
             C63 17 57 21 50 21 C43 21 37 17 35 10 Z"
          fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
  </svg>`;

/* ── State ──────────────────────────────────────── */
let db = null;
let shirts = [];                 // alle trøjer i hukommelsen
const urlCache = new Map();      // imageId -> data-URL
let filters = { q: '', klub: '', saeson: '', type: '', sort: 'nyeste' };
let editImages = [];             // billeder i admin-formularen
let editRemoved = [];            // billed-id'er der skal slettes ved gem

/* ── IndexedDB ──────────────────────────────────── */
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('trojesamlingen', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('shirts')) d.createObjectStore('shirts', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('images')) d.createObjectStore('images', { keyPath: 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    const out = fn(s);
    t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const idbPut = (store, val) => tx(store, 'readwrite', s => s.put(val));
const idbDel = (store, key) => tx(store, 'readwrite', s => s.delete(key));
function idbGet(store, key) {
  return new Promise((res, rej) => {
    const r = db.transaction(store).objectStore(store).get(key);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbAll(store) {
  return new Promise((res, rej) => {
    const r = db.transaction(store).objectStore(store).getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
}

async function loadShirts() {
  shirts = await idbAll('shirts');
  shirts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
}

/* ── Farvetoner ─────────────────────────────────── */
function hexToTone(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec((hex || '').trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = Math.round(h * 60);
    if (h < 0) h += 360;
  }
  const l = (max + min) / 2;
  const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  // hold tonen i et leje hvor hvid tekst kan læses på glasset
  return [h, Math.min(88, Math.max(18, Math.round(s * 100))), Math.min(52, Math.max(20, Math.round(l * 100)))];
}
function toneToHex([h, s, l]) {
  const a = (s / 100) * Math.min(l / 100, 1 - l / 100);
  const f = n => {
    const k = (n + h / 30) % 12;
    const v = l / 100 - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
    return Math.round(255 * v).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(8) + f(4);
}
function toneOf(s) {
  if (s && s.farve) {
    const t = hexToTone(s.farve);
    if (t) return t;
  }
  const k = ((s && s.klub) || '').toLocaleLowerCase('da').trim();
  if (CLUB_TONES[k]) return CLUB_TONES[k];
  let hash = 0;
  for (let i = 0; i < k.length; i++) hash = (hash * 31 + k.charCodeAt(i)) % 360;
  return [hash, 55, 36];
}
const toneStr = t => t[0] + ' ' + t[1] + '% ' + t[2] + '%';
/* Forsidens grundtone — neutral, så klubfarverne i gitteret får lov at tale */
const HOME_TONE = '215 42% 34%';
function setPageTone(s) {
  document.documentElement.style.setProperty('--tone', toneStr(toneOf(s)));
}

/* ── Billeder ───────────────────────────────────── */
function newId() {
  return (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
}

/* Komprimér upload til maks 1600 px JPEG, så databasen ikke vokser unødigt. */
async function compressImage(file) {
  try {
    const bmp = await createImageBitmap(file);
    const max = 1600;
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
    bmp.close && bmp.close();
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
    return blob || file;
  } catch {
    return file; // ukendt format — gem originalen
  }
}

/* Data-URL'er frem for objectURL'er: blob:-URL'er blokeres, når siden
   åbnes direkte fra file://, og data-URL'er virker overalt. */
async function urlFor(imageId) {
  if (!imageId) return null;
  if (urlCache.has(imageId)) return urlCache.get(imageId);
  const rec = await idbGet('images', imageId);
  if (!rec || !rec.blob) return null;
  const u = await blobToDataURL(rec.blob);
  urlCache.set(imageId, u);
  return u;
}

/* ── Hjælpere ───────────────────────────────────── */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function seasonKey(s) {
  const m = /(\d{4})/.exec(s || '');
  return m ? parseInt(m[1], 10) : 0;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove('show'), 2600);
}
function badgesHtml(s) {
  // Kvalitet vises ikke som badge — den står i info-listen; kun Signeret fremhæves.
  return s.signeret ? '<span class="badge">Signeret</span>' : '';
}
function subtitle(s) {
  const parts = [];
  if (s.type) parts.push(TYPE_LABELS[s.type] || s.type);
  if (s.saeson) parts.push(s.saeson);
  let t = parts.join(' · ');
  if (s.spiller) t += (t ? ' — ' : '') + s.spiller + (s.nummer ? ' #' + s.nummer : '');
  return t;
}

/* ── SHA-256 (crypto.subtle + ren JS-fallback) ──── */
async function sha256hex(str) {
  if (crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  return sha256js(str);
}
function sha256js(ascii) { // kompakt fallback til usikre kontekster
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  const words = []; let asciiBitLength = ascii.length * 8;
  let hash = sha256js.h = sha256js.h || [];
  const k = sha256js.k = sha256js.k || [];
  let primeCounter = k.length;
  const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (Math.pow(candidate, 0.5) * 4294967296) | 0;
      k[primeCounter++] = (Math.pow(candidate, 1 / 3) * 4294967296) | 0;
    }
  }
  ascii = unescape(encodeURIComponent(ascii)) + '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / 4294967296) | 0);
  words[words.length] = (asciiBitLength);
  let result = '';
  const h = hash.slice(0, 8);
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16);
    const oldHash = h.slice(0);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = h[0], e = h[4];
      const temp1 = h[7]
        + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25))
        + ((e & h[5]) ^ (~e & h[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))
          ) | 0);
      const temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22))
        + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
      h.unshift((temp1 + temp2) | 0);
      h.pop();
      h[4] = (h[4] + temp1) | 0;
    }
    for (let i = 0; i < 8; i++) h[i] = (h[i] + oldHash[i]) | 0;
  }
  for (let i = 0; i < 8; i++) {
    for (let j = 3; j + 1; j--) {
      const b = (h[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}

/* ── Adgang ─────────────────────────────────────── */
function isAuthed() {
  return sessionStorage.getItem(AUTH_KEY) === PASS_HASH || localStorage.getItem(AUTH_KEY) === PASS_HASH;
}
function logout() {
  sessionStorage.removeItem(AUTH_KEY);
  localStorage.removeItem(AUTH_KEY);
  location.hash = '#/login';
}

/* ── Tema ───────────────────────────────────────── */
const THEME_KEY = 'ts_theme';
function initTheme() {
  try {
    const t = localStorage.getItem(THEME_KEY);
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
}
initTheme();
function toggleTheme() {
  const mørk = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.hasAttribute('data-theme')
        && matchMedia('(prefers-color-scheme: dark)').matches);
  const ny = mørk ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', ny);
  try { localStorage.setItem(THEME_KEY, ny); } catch (e) {}
}

/* ── Router ─────────────────────────────────────── */
const app = document.getElementById('app');
let pendingHash = null;

async function route() {
  const h = location.hash || '#/';
  if (!isAuthed()) {
    if (h !== '#/login') pendingHash = h;
    renderLogin();
    return;
  }
  if (h === '#/login') { location.hash = pendingHash || '#/'; return; }
  const parts = h.replace(/^#\//, '').split('/');
  if (parts[0] === 'troje' && parts[1]) await renderDetail(parts[1]);
  else if (parts[0] === 'admin' && parts[1] === 'rediger' && parts[2]) await renderAdmin(parts[2]);
  else if (parts[0] === 'admin') await renderAdmin(null);
  else await renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ── Topbjælke ──────────────────────────────────── */
function uniqueSorted(field) {
  const map = new Map();
  for (const s of shirts) {
    const v = (s[field] || '').trim();
    if (!v) continue;
    const key = v.toLocaleLowerCase('da');
    map.set(key, { label: v, count: (map.get(key)?.count || 0) + 1 });
  }
  return [...map.values()].sort((a, b) => a.label.localeCompare(b.label, 'da'));
}
function navDrop(title, items) {
  if (!items.length) return '';
  return `<details class="navdrop">
    <summary>${title}</summary>
    <div class="navdrop-menu glass">${items}</div>
  </details>`;
}
function topbarHtml() {
  const klubber = uniqueSorted('klub').map(k =>
    `<button data-filter="klub" data-value="${esc(k.label)}">${esc(k.label)} <span class="count">${k.count}</span></button>`).join('');
  const saesoner = uniqueSorted('saeson')
    .sort((a, b) => seasonKey(b.label) - seasonKey(a.label))
    .map(k => `<button data-filter="saeson" data-value="${esc(k.label)}">${esc(k.label)} <span class="count">${k.count}</span></button>`).join('');
  const typer = Object.entries(TYPE_LABELS)
    .filter(([v]) => shirts.some(s => s.type === v))
    .map(([v, l]) => `<button data-filter="type" data-value="${v}">${l}</button>`).join('');
  return `
  <div class="wrap bar-holder">
    <header class="glass bar">
      <a class="brand" href="#/"><i>◆</i> Trøjesamlingen</a>
      <button class="icon-btn burger" id="burger" aria-label="Menu">☰</button>
      <nav class="mainnav" id="mainnav">
        <a class="navlink" href="#/" data-nav="alle">Samlingen</a>
        ${navDrop('Klub', klubber)}
        ${navDrop('Sæson', saesoner)}
        ${navDrop('Type', typer)}
        <span class="nav-right">
          <a class="navlink" href="#/admin">Administrér</a>
          <button class="navlink" id="logoutBtn">Log ud</button>
        </span>
      </nav>
      <button class="icon-btn" id="themeBtn" title="Skift lyst / mørkt">◐</button>
    </header>
  </div>`;
}
function bindTopbar() {
  const nav = document.getElementById('mainnav');
  document.getElementById('burger').onclick = () => nav.classList.toggle('open');
  document.getElementById('themeBtn').onclick = toggleTheme;
  document.getElementById('logoutBtn').onclick = logout;
  nav.querySelector('[data-nav="alle"]').onclick = () => {
    filters = { ...filters, q: '', klub: '', saeson: '', type: '' };
  };
  nav.querySelectorAll('.navdrop-menu button').forEach(b => {
    b.onclick = () => {
      filters = { ...filters, q: '', klub: '', saeson: '', type: '' };
      filters[b.dataset.filter] = b.dataset.value;
      nav.classList.remove('open');
      nav.querySelectorAll('details').forEach(d => d.open = false);
      if (location.hash === '#/' || location.hash === '') renderHome();
      else location.hash = '#/';
    };
  });
  document.addEventListener('click', e => {
    nav.querySelectorAll('details[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; });
  }, { capture: true });
}

/* ── Login ──────────────────────────────────────── */
function renderLogin() {
  app.innerHTML = `
  <div class="login-page">
    <form class="glass login-card" id="loginForm">
      <div class="brand"><i>◆</i> Trøjesamlingen</div>
      <h1>Privat samling</h1>
      <p>Indtast adgangskoden for at se kataloget.</p>
      <input type="password" id="pw" placeholder="Adgangskode" autocomplete="current-password" autofocus>
      <label class="login-remember"><input type="checkbox" id="remember"> Husk mig på denne enhed</label>
      <div class="login-error" id="loginError"></div>
      <button class="btn" type="submit">Lås op</button>
    </form>
  </div>`;
  document.getElementById('loginForm').onsubmit = async e => {
    e.preventDefault();
    const val = document.getElementById('pw').value;
    const hash = await sha256hex(val);
    if (hash === PASS_HASH) {
      (document.getElementById('remember').checked ? localStorage : sessionStorage).setItem(AUTH_KEY, hash);
      location.hash = pendingHash || '#/';
      pendingHash = null;
      route();
    } else {
      document.getElementById('loginError').textContent = 'Forkert adgangskode — prøv igen.';
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  };
}

/* ── Forside ────────────────────────────────────── */
function applyFilters(list) {
  let out = list.filter(s => {
    if (filters.klub && (s.klub || '').toLocaleLowerCase('da') !== filters.klub.toLocaleLowerCase('da')) return false;
    if (filters.saeson && (s.saeson || '') !== filters.saeson) return false;
    if (filters.type && s.type !== filters.type) return false;
    if (filters.q) {
      const hay = [s.klub, s.saeson, s.spiller, s.nummer, s.noter, TYPE_LABELS[s.type], s.stoerrelse]
        .join(' ').toLocaleLowerCase('da');
      if (!hay.includes(filters.q.toLocaleLowerCase('da'))) return false;
    }
    return true;
  });
  switch (filters.sort) {
    case 'aeldst': out.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); break;
    case 'klub': out.sort((a, b) => (a.klub || '').localeCompare(b.klub || '', 'da') || seasonKey(b.saeson) - seasonKey(a.saeson)); break;
    case 'saeson': out.sort((a, b) => seasonKey(b.saeson) - seasonKey(a.saeson) || (a.klub || '').localeCompare(b.klub || '', 'da')); break;
    default: out.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  }
  return out;
}

async function cardHtml(s) {
  const u1 = await urlFor(s.billeder?.[0]);
  const u2 = await urlFor(s.billeder?.[1]);
  const img = u1
    ? `<img class="primary" src="${u1}" alt="${esc(s.klub)}" loading="lazy">${u2 ? `<img class="alt" src="${u2}" alt="" loading="lazy">` : ''}`
    : PLACEHOLDER_SVG;
  return `
  <a class="card" href="#/troje/${s.id}" style="--tone:${toneStr(toneOf(s))}">
    <div class="card-top">
      <span class="tag">${esc(TYPE_LABELS[s.type] || s.type || '—')}</span>
      <span class="meta">${esc(s.saeson || '—')}</span>
    </div>
    <div class="card-img">${img}</div>
    <div>
      <h3>${esc(s.klub) || 'Ukendt klub'}</h3>
      <p class="meta">${esc(s.spiller ? s.spiller + (s.nummer ? ' · ' + s.nummer : '') : (s.kvalitet === 'autentisk' ? 'Autentisk' : 'Replica'))}</p>
    </div>
    ${s.signeret ? '<div style="position:absolute;top:22px;right:22px">' + badgesHtml(s) + '</div>' : ''}
  </a>`;
}

function statsData() {
  const klubMap = new Map();
  for (const s of shirts) {
    const k = (s.klub || 'Ukendt').trim() || 'Ukendt';
    klubMap.set(k, (klubMap.get(k) || 0) + 1);
  }
  const aar = shirts.map(s => seasonKey(s.saeson)).filter(Boolean);
  return {
    total: shirts.length,
    klubber: klubMap.size,
    saesoner: new Set(shirts.map(s => s.saeson).filter(Boolean)).size,
    autentiske: shirts.filter(s => s.kvalitet === 'autentisk').length,
    signerede: shirts.filter(s => s.signeret).length,
    aeldst: aar.length ? Math.min(...aar) : '—',
    nyest: aar.length ? Math.max(...aar) : '—',
    perKlub: [...klubMap.entries()].sort((a, b) => b[1] - a[1]),
  };
}

/* ── Slet ───────────────────────────────────────── */
async function deleteShirt(id, goHome) {
  const s = shirts.find(x => x.id === id);
  if (!s) return;
  if (!confirm(`Slet "${s.klub || 'trøje'} ${s.saeson || ''}" permanent? Billederne slettes også.`)) return;
  for (const imgId of (s.billeder || [])) {
    await idbDel('images', imgId);
    urlCache.delete(imgId);
  }
  await idbDel('shirts', id);
  await loadShirts();
  toast('Trøjen er slettet.');
  if (goHome) location.hash = '#/';
  else renderAdmin(null);
}

/* ── Backup ─────────────────────────────────────── */
function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}
async function exportBackup() {
  toast('Pakker backup …');
  const images = [];
  for (const rec of await idbAll('images')) {
    images.push({ id: rec.id, data: await blobToDataURL(rec.blob) });
  }
  const payload = { app: 'trojesamlingen', version: 1, exportedAt: new Date().toISOString(), shirts, images };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `trojesamlingen-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('Backup downloadet.');
}
async function importBackup(file) {
  if (!file) return;
  let payload;
  try {
    payload = JSON.parse(await file.text());
    if (payload.app !== 'trojesamlingen' || !Array.isArray(payload.shirts)) throw new Error('format');
  } catch {
    toast('Filen kunne ikke læses som en gyldig backup.');
    return;
  }
  const n = payload.shirts.length;
  if (!confirm(`Importér ${n} ${n === 1 ? 'trøje' : 'trøjer'} fra backuppen?`)) return;
  if (shirts.length) {
    const merge = confirm(
      `Du har allerede ${shirts.length} ${shirts.length === 1 ? 'trøje' : 'trøjer'} i samlingen.\n\n` +
      `OK = FLET — behold det nuværende og tilføj/opdater fra backuppen.\n` +
      `Annuller = ERSTAT — slet alt og indlæs kun backuppen.`);
    if (!merge) {
      if (!confirm('Er du sikker? Hele den nuværende samling slettes.')) return;
      for (const s of await idbAll('shirts')) await idbDel('shirts', s.id);
      for (const im of await idbAll('images')) await idbDel('images', im.id);
      urlCache.clear();
    }
  }
  for (const im of (payload.images || [])) {
    const blob = await (await fetch(im.data)).blob();
    await idbPut('images', { id: im.id, blob });
  }
  for (const s of payload.shirts) await idbPut('shirts', s);
  await loadShirts();
  toast(`Importerede ${n} ${n === 1 ? 'trøje' : 'trøjer'}.`);
  renderAdmin(null);
}

/* ── Init ───────────────────────────────────────── */
(async function init() {
  db = await openDB();
  await loadShirts();
  route();
})();
</script>
</body>
</html>
